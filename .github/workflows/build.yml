name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JellyfishOcean-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JellyfishOcean-debug-apk
          path: JellyfishOcean-debug.apk

      # 發佈到 Releases，手機瀏覽器可以直接下載 APK
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Jellyfish Ocean build ${{ github.run_number }}
          files: JellyfishOcean-debug.apk
